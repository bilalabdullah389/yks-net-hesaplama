<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="description" content="Bilal'in 120 Soruluk Akıllı TYT Net Hesaplama Robotu. Hatalı soru girişini engelleyen profesyonel sistem.">
    <meta name="keywords" content="Bilal TYT, TYT Robotu, Akıllı Net Hesaplama, 120 Soru TYT">
    
    <title>Bilal'in Akıllı TYT Robotu</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { —bg-color: #f4f7f6; --text-color: #333; --card-bg: #fff; --accent-color: #2ecc71; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #f4f7f6; --card-bg: #2d2d2d; --accent-color: #27ae60; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 20px 0; }
        .container { background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 400px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .inputs { display: flex; gap: 10px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: var(--card-bg); color: var(--text-color); text-align: center; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn-calc { background-color: var(--accent-color); color: white; }
        .btn-theme { background-color: #3498db; color: white; margin-bottom: 20px; }
        .result { margin-top: 20px; padding: 15px; background: rgba(46, 204, 113, 0.1); border-radius: 8px; border: 1px solid var(--accent-color); }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <button class="btn-theme" onclick="toggleTheme()">🌙 Modu Değiştir</button>
    <h2>TYT Net Hesaplama</h2>
    <div class="input-group">
        <label>Türkçe (40 Soru):</label>
        <div class="inputs">
            <input type="number" id="trD" placeholder="Doğru" oninput="limit(this, 40, 'trY')">
            <input type="number" id="trY" placeholder="Yanlış" oninput="limit(this, 40, 'trD')">
        </div>
    </div>

    <div class="input-group">
        <label>Sosyal (20 Soru):</label>
        <div class="inputs">
            <input type="number" id="sosD" placeholder="Doğru" oninput="limit(this, 20, 'sosY')">
            <input type="number" id="sosY" placeholder="Yanlış" oninput='limit(this, 20, 'sosD')">
        </div>
    </div>
    <div class="input-group">
        <label>Sosyal (20 Soru):</label>
        <div class="inputs">
            <input type="number" id="sosD" placeholder="Doğru" oninput="limit(this, 20, 'sosY')">
            <input type="number" id="sosY" placeholder="Yanlış" oninput="limit(this, 20, 'sosD')">
        </div>
    </div>

    <div class="input-group">
        <label>Matematik (40 Soru):</label>
        <div class="inputs">
            <input type="number" id="matD" placeholder="Doğru" oninput="limit(this, 40, 'matY')">
            <input type="number" id="matY" placeholder="Yanlış" oninput="limit(this, 40, 'matD')">
        </div>
    </div>
    <div class="input-group">
        <label>Fen (20 Soru):</label>
        <div class="inputs">
            <input type="number" id="fenD" placeholder="Doğru" oninput="limit(this, 20, 'fenY')">
            <input type="number" id="fenY" placeholder="Yanlış" oninput="limit(this, 20, 'fenD')">
        </div>
    </div>

    <button class="btn-calc" onclick="hesapla()">Hesapla</button>

    <div class="result" id="sonuc" style="display:none;">
        <strong>Toplam Net: </strong> <span id="top-net">0</span><br>
        <strong>Tahmini TYT Puanı: </strong> <span id="puan">0</span>
    </div>
</div>
<script>
    // AKILLI LİMİT FONKSİYONU: Soru sayısını kontrol eder
    function limit(me, max, otherId) {
        let otherVal = parseFloat(document.getElementById(otherId).value) || 0;
        if (parseFloat(me.value) + otherVal > max) {
            me.value = max - otherVal;
        }
        if (parseFloat(me.value) < 0) me.value = 0;
    }

    function toggleTheme() {
        const body = document.body;
        body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    function hesapla() {
        const dersler = [
            {d: 'trD' , y: 'trY'}, {d: 'sosD', y: 'sosY'},
            {d: 'matD', y: 'matY'}, {d: 'fenD', y: 'fenY'}
        ];

        let toplamNet = 0;
        dersler.forEach(ders => {
            let d = parseFloat(document.getElementById(ders.d).value) || 0;
            let y = parseFloat(document.getElementById(ders.y).value) || 0;
            toplamNet += (d - (y * 0.25));
        });
        let tytPuan = 100 + (toplamNet * 3.33);
        document.getElementById('top-net').innerText = toplamNet.toFixed(2);
        document.getElementById('puan').innerText = tytPuan.toFixed(2);
        document.getElementById('sonuc').style.display = 'block';
    }
</script>

</body>
</html>

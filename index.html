<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Net ve Puan Hesaplama</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --accent-color: #2ecc71;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f4f7f6;
            --card-bg: #2d2d2d;
            --accent-color: #27ae60;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
      h2 { margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: var(--card-bg); color: var(--text-color); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn-calc { background-color: var(--accent-color); color: white; }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-theme { background-color: #3498db; color: white; margin-bottom: 20px; }
      .result { margin-top: 25px; padding: 15px; background: rgba(46, 204, 113, 0.1); border-radius: 8px; border: 1px solid var(--accent-color); }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-theme" onclick="toggleTheme()">🌙 Modu Değiştir</button>
    <h2>YKS Net & Puan</h2>
    
    <div class="input-group">
        <label>Türkçe (40 Soru):</label>
        <input type=“number” id="tr-dogru" placeholder="Doğru">
        <input type="number" id="tr-yanlis" placeholder="Yanlış" style="margin-top:5px;">
    </div>

    <div class="input-group">
        <label>Matematik (40 Soru):</label>
        <input type="number" id="mat-dogru" placeholder="Doğru">
        <input type="number" id="mat-yanlis" placeholder="Yanlış" style="margin-top:5px;">
    </div>

    <button class="btn-calc" onclick="hesapla()">Hesapla</button>
    <button class="btn-clear" onclick="temizle()">Temizle</button>
    <div class="result" id="sonuc" style="display:none;">
        <strong>Toplam Net: </strong> <span id="toplam-net">0</span><br>
        <strong>Tahmini TYT Puanı: </strong> <span id="tyt-puan">0</span>
    </div>
</div>

<script>
    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    function hesapla() {
        let trD = parseFloat(document.getElementById('tr-dogru').value) || 0;
        let trY =
          parseFloat(document.getElementById('tr-yanlis').value) || 0;
        let matD = parseFloat(document.getElementById('mat-dogru').value) || 0;
        let matY = parseFloat(document.getElementById('mat-yanlis').value) || 0;

        let trNet = trD - (trY * 0.25);
        let matNet = matD - (matY * 0.25);
        let toplamNet = trNet + matNet;
        
        // Basit bir TYT Puan formülü (100 taban puan + her net yaklasik 3.3 puan)
        let tytPuan = 100 + (toplamNet * 3.3);

        document.getElementById('toplam-net').innerText = toplamNet.toFixed(2);
        document.getElementById('tyt-puan').innerText = tytPuan.toFixed(2);
        document.getElementById('sonuc').style.display = 'block';
    }

    function temizle() {
        document.querySelectorAll('input').forEach(input => input.value = '');
        document.getElementById('sonuc').style.display = 'none';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesyonel YKS Net Hesaplama</title>
  <style>
    /* Modern Tasarım Dokunuşları */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }
    h2 { color: #333; margin-bottom: 20px; }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
input:focus {
      border-color: #764ba2;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #764ba2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    button:hover { background-color: #5a377d; }
    .result-area {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
    }#sonuc {
      font-size: 24px;
      font-weight: bold;
      color: #764ba2;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>YKS Net Hesaplama</h2>

  <input type="number" id="dogru" placeholder="Doğru Sayısı" min="0">
  <input type="number" id="yanlis" placeholder="Yanlış Sayısı" min="0">

  <button onclick="hesapla()">Hesapla</button>

  <div class="result-area">
    <p style="margin: 0; color: #666;">Sonuç:</p>
    <h3 id="sonuc">0.00 Net</h3>
  </div>
</div>

<script>
function hesapla() {
  // Verileri al ve sayıya çevir (Boşsa 0 kabul et)
  const d = parseFloat(document.getElementById("dogru").value) || 0;
  const y = parseFloat(document.getElementById("yanlis").value) || 0;

// 4 yanlış 1 doğruyu götürür mantığı
  let net = d - (y / 4);

  // Netin mantıksız (eksi) çıkmasını engelle
  if (net < 0) net = 0;

  // Sonucu ekrana yazdır
  document.getElementById("sonuc").innerText = net.toFixed(2) + " Net";
}
</script>

</body>
</html>
}
